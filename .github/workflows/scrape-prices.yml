name: Scrape oljuprisir

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

concurrency:
  group: scrape-prices
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Scrape prices
        run: node .github/scripts/scrape.js

      - name: Commit prices
        run: |
          git config user.name "Prisvakt Bot"
          git config user.email "bot@prisvakt.fo"
          git add prices-override.json price-history.json
          if git diff --staged --quiet; then
            echo "Eingi broytingar"
            exit 0
          fi
          git commit -m "Uppfaer prisir $(date '+%d/%m/%Y %H:%M')"
          for i in 1 2 3; do
            git fetch origin main
            git rebase -X theirs origin/main || { git rebase --abort || true; sleep 5; continue; }
            if git push origin HEAD:main; then
              echo "Push ok"
              exit 0
            fi
            sleep 5
          done
          echo "Push miseydnadist"
          exit 1
