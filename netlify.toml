[build]
  functions = "netlify/functions"

[[redirects]]
  from = "/api/fuel-prices"
  to = "/.netlify/functions/fuel-prices"
  status = 200

[functions]
  # NB: fuel-prices má ikki hava "schedule" — Netlify blokerar HTTP-kall
  # (403) til scheduled functions, og fronturin kallar hana við fetch().
  # Prísirnir verða dagførdir av .github/workflows/scrape-prices.yml, sum
  # committar prices-override.json og útløysir eitt nýtt deploy.
  [functions.save-history]
    schedule = "0 */3 * * *"
